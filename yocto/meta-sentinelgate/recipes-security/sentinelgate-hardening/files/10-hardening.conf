# SentinelGate v1.0 systemd sandboxing profile.
# Kept compatible with a firewall service that needs nftables/netlink access.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# SentinelGate needs to persist events/state and may use /run for runtime data.
ReadWritePaths=/var/lib/sentinelgate /var/log/sentinelgate /run/sentinelgate

# Keep only the capabilities normally required for firewall/network control.
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
